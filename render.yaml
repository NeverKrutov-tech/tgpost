services:
  - type: web
    name: tgpost-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m src.tg_autopost.render_web
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: CHANNEL_LINK
        sync: false
      - key: ADMIN_ID
        sync: false
      # Donor channels for the Telegram parser. Without this the whole
      # Telegram ingest branch is skipped and only site sources feed the queue.
      - key: TELEGRAM_SOURCES
        value: platinum_aneks,baneksru,X0xoTyH,anekdot_x,sexxx_pornohumor_prikoly
      # Cloudflare Workers AI - powers the truncated-joke check before
      # publishing. Missing values make the check a silent no-op, exactly
      # how TELEGRAM_SOURCES once disabled Telegram ingest unnoticed.
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_API_TOKEN
        sync: false

